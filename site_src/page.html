<!doctype html>
<html lang="${lang}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>${title} - Claude Code Docs (offline)</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg stroke='%23d97757' stroke-width='4' stroke-linecap='round'%3E%3Cpath d='M16 4v24M5.6 10l20.8 12M5.6 22l20.8-12'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="${root}style.css"></head>
<body data-root="${root}" data-slug="${slug}" data-lang="${lang}">
<a class="skip" href="#content">${t_skip}</a>
<div id="chrome">
<header id="top">
<button id="navtoggle" type="button" aria-label="${t_toggle}" aria-controls="nav" aria-expanded="false">&#9776;</button>
<a class="logo" href="${root}index.html"><span class="star">&#10059;</span>Claude Code Docs<span class="offline">offline</span></a>
<details class="lang"><summary>${t_lang}</summary><div class="menu"><a href="${en_href}">English</a><a href="${ko_href}">한국어</a></div></details>
<button id="searchbtn" type="button" aria-haspopup="dialog">${icon_search}<span>${t_search}</span><kbd>Ctrl K</kbd></button>
</header>
<nav id="tabs" aria-label="${t_sections}"></nav>
</div>
<div id="shell">
<nav id="nav" aria-label="${t_pages}"></nav>
<main id="content" tabindex="-1"><article>
<div class="crumbs">${crumbs}</div>
${notice}<button id="copypage" type="button">${icon_copy}<span>${t_copy_page}</span></button>
${body}
<footer>${t_source}: <a href="${url}">${url}</a> &middot; ${t_snapshot} ${fetched}</footer>
</article></main>
<aside id="toc" aria-label="${t_toc}"></aside>
</div>
<script type="application/json" id="md-src">${md}</script>
<script src="${root}nav-data-${lang}.js"></script><script src="${root}nav.js"></script>
</body></html>
